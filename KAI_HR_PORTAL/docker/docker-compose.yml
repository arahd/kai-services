version: "3.9"

services:
  app:
    container_name: candidate-assessment-api

    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "5000:5000"

    env_file:
      - ../.env

    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1

    volumes:
      - ..:/app

    restart: unless-stopped