worker_processes auto;
events{}
 
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
 
    server {
        root /usr/share/nginx/html;
        index index.html;
 
        # Never cache index.html - always get fresh version
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }
        
        # Cache hashed JS/CSS files aggressively (they have unique names)
        location ~* \.(js|css|mjs)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
            try_files $uri /index.html;  # Changed =404 to /index.html fallback
        }
        
        # Cache assets
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
            try_files $uri =404;
        }
        
        # All other routes fallback to index.html for Angular routing
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        error_page 404 /index.html;
    }
}