<div class="toast-container toast-container--top">
  @for (toast of topToasts; track toast.id) {
    <div class="toast" [ngClass]="toast.type">
      <div class="toast-main">
        @if (toast.type === 'error') {
          <span class="toast-caution" aria-hidden="true">
            <svg
              class="toast-caution-icon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 9v4M12 17h.01"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        }
        <span class="toast-text">{{ toast.message }}</span>
      </div>
      <button type="button" class="close-btn" (click)="removeToast(toast.id)">×</button>
    </div>
  }
</div>

<div class="toast-container toast-container--bottom">
  @for (toast of bottomToasts; track toast.id) {
    <div class="toast toast--bottom-banner" role="status" [attr.aria-live]="'polite'">
      <div class="toast-banner__main">
        <span class="toast-banner__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="9" fill="#49AB74" />
            <path
              d="M12.66 6.3L7.66 11.3L5.94 9.57"
              stroke="white"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="toast-banner__text">{{ toast.message }}</span>
      </div>
    </div>
  }
</div>
