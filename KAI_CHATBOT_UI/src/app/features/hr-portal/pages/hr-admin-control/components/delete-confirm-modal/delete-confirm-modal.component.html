@if (isOpen && user) {
  <div
    class="modal-backdrop"
    (click)="onBackdropClick($event)"
    role="dialog"
    aria-modal="true"
  >
    <div class="delete-modal-card" (click)="$event.stopPropagation()">
      <div class="delete-icon-wrapper">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18"></path>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>

      <div class="delete-content">
        <h2 class="delete-title">Delete User</h2>
        <p class="delete-desc">
          Are you sure you want to remove <strong>{{ user.user_name }}</strong> (<span class="user-email">{{ user.email_id }}</span>) from HR Portal access?
        </p>

        @if (user.is_admin) {
          <div class="admin-warning-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Admin users cannot be deleted directly. Please demote their admin role first.</span>
          </div>
        }

        @if (errorMessage) {
          <div class="alert-banner-error">
            <span>{{ errorMessage }}</span>
          </div>
        }
      </div>

      <div class="delete-actions">
        <button
          type="button"
          class="btn-cancel"
          [disabled]="isDeleting"
          (click)="close.emit()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="btn-danger"
          [disabled]="isDeleting || user.is_admin"
          (click)="onConfirm()"
        >
          @if (isDeleting) {
            <span class="spinner"></span>
            <span>Deleting...</span>
          } @else {
            <span>Delete User</span>
          }
        </button>
      </div>
    </div>
  </div>
}
